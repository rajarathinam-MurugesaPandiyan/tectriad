<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var saved =
            localStorage.getItem("tech-triad-theme") ||
            localStorage.getItem("ethics-theme");
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (saved === "light" || saved === "dark") {
            if (meta) meta.setAttribute("content", saved);
            document.documentElement.setAttribute("data-theme", saved);
          } else {
            if (meta) meta.setAttribute("content", "light dark");
            var prefersDark = window.matchMedia(
              "(prefers-color-scheme: dark)"
            ).matches;
            document.documentElement.setAttribute(
              "data-theme",
              prefersDark ? "dark" : "light"
            );
          }
        } catch (e) {}
      })();
    </script>
    <title>Tech Triad | Rajarathinam, Gowtham &amp; Gary — Ethics Of Coding, xpense-cloud &amp; Streako</title>
    <meta
      name="description"
      content="Tech Triad is founded by Rajarathinam, Gowtham, and Gary—building products and services including Ethics Of Coding (free Tamil coding tutorials), xpense-cloud, and Streako."
    />
    <meta
      name="keywords"
      content="Tech Triad, Rajarathinam, Gowtham, Gary, Ethics Of Coding, xpense-cloud, Streako, Flutter Tamil, Web Development, Habit Tracker, Expense Tracker"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
